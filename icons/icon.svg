<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)"/>

  <!-- Watch case outer -->
  <circle cx="64" cy="64" r="45" fill="none" stroke="url(#gold)" stroke-width="6"/>

  <!-- Watch case inner -->
  <circle cx="64" cy="64" r="38" fill="#1a1a2e"/>

  <!-- Watch dial -->
  <circle cx="64" cy="64" r="35" fill="#0a0a15"/>

  <!-- Hour markers -->
  <g fill="#fbbf24">
    <rect x="62" y="32" width="4" height="8" rx="1"/>
    <rect x="62" y="88" width="4" height="8" rx="1"/>
    <rect x="88" y="62" width="8" height="4" rx="1"/>
    <rect x="32" y="62" width="8" height="4" rx="1"/>
  </g>

  <!-- Hour hand -->
  <rect x="62" y="45" width="4" height="22" rx="2" fill="#ffffff"/>

  <!-- Minute hand -->
  <rect x="63" y="35" width="2" height="30" rx="1" fill="#ffffff"/>

  <!-- Center dot -->
  <circle cx="64" cy="64" r="4" fill="url(#gold)"/>

  <!-- Crown -->
  <rect x="107" y="58" width="10" height="12" rx="2" fill="url(#gold)"/>

  <!-- Price tag indicator -->
  <circle cx="100" cy="100" r="18" fill="#10b981"/>
  <text x="100" y="106" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="18" fill="white">$</text>
</svg>
